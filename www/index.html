<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>vsmahant - Nidhi AI</title>
  <script src="nidhi-keys.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }

    body {
      height: 100vh;
      background: radial-gradient(circle at 20% 20%, #1b1035, #090614 60%);
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #2b1a5e, #080512);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      z-index: 999;
      transition: opacity .6s ease;
    }

    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      display: grid;
      place-items: center;
      font-size: 52px;
      box-shadow: 0 0 45px rgba(139, 92, 246, .75);
      animation: pulse 1.8s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 35px rgba(139,92,246,.55); }
      50% { transform: scale(1.07); box-shadow: 0 0 65px rgba(6,182,212,.75); }
    }

    #splash h1 { font-size: 34px; letter-spacing: 1px; }
    #splash p { opacity: .7; }

    header {
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      display: grid;
      place-items: center;
      font-size: 20px;
    }

    header h2 { font-size: 18px; }
    header small { opacity: .65; display: block; }

    .headerBtn {
      margin-left: auto;
      background: rgba(255,255,255,.1);
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .msg {
      max-width: 82%;
      padding: 12px 14px;
      border-radius: 18px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: fadeIn .25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .user {
      align-self: flex-end;
      background: linear-gradient(135deg, #6d28d9, #4f46e5);
      border-bottom-right-radius: 5px;
    }

    .nidhi {
      align-self: flex-start;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.09);
      border-bottom-left-radius: 5px;
    }

    .typing { opacity: .65; font-style: italic; }

    footer {
      padding: 12px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.05);
      border-top: 1px solid rgba(255,255,255,.08);
    }

    .inputRow {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #textInput {
      flex: 1;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      padding: 13px 15px;
      border-radius: 24px;
      outline: none;
      font-size: 15px;
    }

    #sendBtn, #micBtn {
      border: none;
      cursor: pointer;
      color: #fff;
      border-radius: 50%;
      display: grid;
      place-items: center;
    }

    #sendBtn {
      width: 46px;
      height: 46px;
      background: linear-gradient(135deg, #8b5cf6, #06b6d4);
      font-size: 18px;
    }

    #micBtn {
      width: 62px;
      height: 62px;
      background: linear-gradient(135deg, #ec4899, #8b5cf6);
      font-size: 25px;
      box-shadow: 0 0 25px rgba(236,72,153,.45);
      transition: transform .2s;
    }

    #micBtn.listening {
      animation: micPulse 1s infinite;
      background: linear-gradient(135deg, #ef4444, #f97316);
    }

    @keyframes micPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }

    #status {
      text-align: center;
      font-size: 12px;
      opacity: .65;
      margin-top: 8px;
      min-height: 16px;
    }

    .bridgePanel {
      display: flex;
      gap: 8px;
      padding: 0 12px 8px;
      overflow-x: auto;
    }

    .bridgeBtn {
      flex: 0 0 auto;
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.12);
      color: #fff;
      padding: 8px 12px;
      border-radius: 14px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="splash">
    <div class="logo">✨</div>
    <h1>vsmahant</h1>
    <p>Nidhi Voice AI Assistant</p>
  </div>

  <header>
    <div class="avatar">✨</div>
    <div>
      <h2>Nidhi AI</h2>
      <small id="onlineStatus">Online • Groq AI</small>
    </div>
    <button id="clearChat" class="headerBtn">🗑️</button>
  </header>

  <main id="chat"></main>

  <div class="bridgePanel">
    <button class="bridgeBtn" onclick="checkBridges()">🔌 Bridge Check</button>
    <button class="bridgeBtn" onclick="requestAccessibility()">♿ Accessibility</button>
    <button class="bridgeBtn" onclick="openTermux()">📱 Open Termux</button>
    <button class="bridgeBtn" onclick="runTermuxCommand('termux-battery-status')">🔋 Battery</button>
    <button class="bridgeBtn" onclick="runTermuxCommand('termux-toast "Nidhi active hai"')">📢 Toast</button>
  </div>

  <footer>
    <div class="inputRow">
      <input id="textInput" type="text" placeholder="Nidhi se kuch bhi poochhein..." autocomplete="off" />
      <button id="sendBtn">➤</button>
      <button id="micBtn">🎤</button>
    </div>
    <div id="status">“Hey Nidhi” boliye, mic dabayein ya type karein</div>
  </footer>

<script>
  const GROQ_API_KEYS = (window.NIDHI_GROQ_KEYS || "")
    .split(",")
    .map(k => k.trim())
    .filter(Boolean);

  let currentKeyIndex = 0;

  const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
  const MODEL = "openai/gpt-oss-120b";

  const SYSTEM_PROMPT = `
Tumhara naam Nidhi hai. Tum vsmahant app ki helpful AI assistant ho.
Tum Hindi aur English dono me clear jawab deti ho.
Sensitive, illegal, harmful ya destructive commands suggest nahi karti.
Kisi bhi system command ko execute karne se pehle user se confirmation lena zaroori hai.
Privacy aur device security ka respect karti ho.
  `.trim();

  const WAKE_WORDS = [
    "hey nidhi", "hay nidhi", "hai nidhi",
    "हे निधि", "हाय निधि"
  ];

  const chat = document.getElementById("chat");
  const textInput = document.getElementById("textInput");
  const sendBtn = document.getElementById("sendBtn");
  const micBtn = document.getElementById("micBtn");
  const statusEl = document.getElementById("status");
  const clearChat = document.getElementById("clearChat");
  const splash = document.getElementById("splash");

  let history = [];
  let listening = false;
  let busy = false;
  let wakeMode = false;

  setTimeout(() => {
    splash.style.opacity = "0";
    setTimeout(() => splash.remove(), 650);
  }, 1800);

  function addMessage(text, role, temporary = false) {
    const div = document.createElement("div");
    div.className = `msg ${role === "user" ? "user" : "nidhi"}`;
    div.textContent = text;

    if (temporary) div.classList.add("typing");

    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  clearChat.addEventListener("click", () => {
    history = [];
    chat.innerHTML = "";
    const msg = "Namaste! Main Nidhi hoon. Kaise help kar sakti hoon?";
    addMessage(msg, "nidhi");
    speak(msg);
  });

  function speak(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "hi-IN";
    utter.rate = 1;
    utter.pitch = 1;

    const voices = window.speechSynthesis.getVoices();
    const hindiVoice = voices.find(v => v.lang.toLowerCase().startsWith("hi"));
    if (hindiVoice) utter.voice = hindiVoice;

    window.speechSynthesis.speak(utter);
  }

  function getNativeBridge() {
    return window.NidhiNative || null;
  }

  function checkBridges() {
    const bridge = getNativeBridge();
    const capacitor = !!window.Capacitor;
    const termux = !!(bridge && bridge.isTermuxAvailable && bridge.isTermuxAvailable());
    const permission = !!(bridge && bridge.hasTermuxPermission && bridge.hasTermuxPermission());

    const msg = `Capacitor: ${capacitor ? "Available" : "Not available"}
Native Bridge: ${bridge ? "Available" : "Not available"}
Termux installed: ${termux ? "Yes" : "No"}
Termux RUN_COMMAND permission: ${permission ? "Granted" : "Not granted"}`;

    addMessage(msg, "nidhi");
    speak(msg.replace(/
/g, ". "));
  }

  async function requestAccessibility() {
    const bridge = getNativeBridge();

    if (!bridge || typeof bridge.requestAccessibility !== "function") {
      const msg = "Accessibility bridge available nahi hai.";
      addMessage(msg, "nidhi");
      speak(msg);
      return;
    }

    try {
      const resultStr = bridge.requestAccessibility();
      const result = typeof resultStr === "string" ? JSON.parse(resultStr) : resultStr;

      const msg = result?.opened
        ? "Accessibility Settings open kar di gayi hain. Permission manually enable karein."
        : "Accessibility Settings open nahi ho payi.";

      addMessage(msg, "nidhi");
      speak(msg);
    } catch (e) {
      const msg = "Accessibility request fail ho gayi.";
      addMessage(msg, "nidhi");
      speak(msg);
    }
  }

  function openTermux() {
    const bridge = getNativeBridge();

    if (!bridge || typeof bridge.openTermux !== "function") {
      const msg = "Termux bridge available nahi hai.";
      addMessage(msg, "nidhi");
      speak(msg);
      return;
    }

    const resultStr = bridge.openTermux();
    const result = typeof resultStr === "string" ? JSON.parse(resultStr) : resultStr;

    addMessage(result.output, "nidhi");
    speak(result.output);
  }

  async function runTermuxCommand(command) {
    const bridge = getNativeBridge();

    if (!bridge || typeof bridge.runTermux !== "function") {
      const msg = "Termux bridge available nahi hai.";
      addMessage(msg, "nidhi");
      speak(msg);
      return;
    }

    const confirmed = confirm(
      `Nidhi Termux me ye command run karna chahti hai:

${command}

Allow karein?`
    );

    if (!confirmed) {
      const msg = "Termux command cancel kar di gayi.";
      addMessage(msg, "nidhi");
      speak(msg);
      return;
    }

    addMessage(`Termux command: ${command}`, "user");

    try {
      const resultStr = bridge.runTermux(JSON.stringify({ command }));
      const result = typeof resultStr === "string" ? JSON.parse(resultStr) : resultStr;
      const output = result?.output || "Command execute nahi ho payi.";

      addMessage(output, "nidhi");
      speak(output);
    } catch (e) {
      const msg = "Termux command execute nahi ho payi.";
      addMessage(msg, "nidhi");
      speak(msg);
    }
  }

  async function askNidhi(userText) {
    if (!userText.trim() || busy) return;

    busy = true;
    textInput.value = "";
    addMessage(userText, "user");

    const thinking = addMessage("Nidhi soch rahi hai...", "nidhi", true);
    history.push({ role: "user", content: userText });

    if (!GROQ_API_KEYS.length) {
      thinking.remove();
      const msg = "Groq API key configured nahi hai. GitHub Secrets me GROQ_KEYS add karein.";
      addMessage(msg, "nidhi");
      speak(msg);
      busy = false;
      return;
    }

    let attempts = 0;
    let success = false;

    while (attempts < GROQ_API_KEYS.length && !success) {
      try {
        const activeKey = GROQ_API_KEYS[currentKeyIndex];

        const res = await fetch(GROQ_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${activeKey}`
          },
          body: JSON.stringify({
            model: MODEL,
            messages: [
              { role: "system", content: SYSTEM_PROMPT },
              ...history.slice(-16)
            ],
            temperature: 0.7,
            max_completion_tokens: 600
          })
        });

        const data = await res.json();

        if (!res.ok) {
          currentKeyIndex = (currentKeyIndex + 1) % GROQ_API_KEYS.length;
          attempts++;
          continue;
        }

        const reply =
          data.choices?.[0]?.message?.content?.trim() ||
          "Sorry, mujhe jawab samajh nahi aaya.";

        thinking.remove();
        addMessage(reply, "nidhi");
        speak(reply);

        history.push({ role: "assistant", content: reply });
        success = true;

      } catch (err) {
        currentKeyIndex = (currentKeyIndex + 1) % GROQ_API_KEYS.length;
        attempts++;
      }
    }

    if (!success) {
      thinking.remove();
      const errorText = "Sorry, API request fail ho gayi. Kripya thodi der baad try karein.";
      addMessage(errorText, "nidhi");
      speak(errorText);
    }

    busy = false;
    statusEl.textContent = "“Hey Nidhi” boliye, mic dabayein ya type karein";
  }

  sendBtn.addEventListener("click", () => askNidhi(textInput.value));

  textInput.addEventListener("keydown", e => {
    if (e.key === "Enter") askNidhi(textInput.value);
  });

  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    micBtn.disabled = true;
    statusEl.textContent = "Is browser me voice input support nahi hai. Type karke poochhein.";
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = "hi-IN";
    recognition.interimResults = true;
    recognition.continuous = true;
    recognition.maxAlternatives = 1;

    function normalize(text) {
      return text.toLowerCase().trim();
    }

    function containsWakeWord(text) {
      const clean = normalize(text);
      return WAKE_WORDS.some(word => clean.includes(word));
    }

    function stripWakeWord(text) {
      let clean = normalize(text);
      for (const word of WAKE_WORDS) {
        clean = clean.replace(word, "").trim();
      }
      return clean;
    }

    micBtn.addEventListener("click", () => {
      if (listening) {
        recognition.stop();
        return;
      }

      window.speechSynthesis.cancel();
      wakeMode = true;

      try {
        recognition.start();
      } catch (e) {
        statusEl.textContent = "Mic already active hai.";
      }
    });

    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add("listening");
      statusEl.textContent = wakeMode
        ? "Wake word mode: “Hey Nidhi” boliye"
        : "Sun rahi hoon... boliye";
    };

    recognition.onresult = event => {
      let finalText = "";
      let interim = "";

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) finalText += transcript;
        else interim += transcript;
      }

      const heard = finalText || interim;
      textInput.value = heard;

      if (!finalText) return;

      if (containsWakeWord(heard)) {
        wakeMode = true;
        const command = stripWakeWord(heard);

        if (command) {
          askNidhi(command);
        } else {
          const reply = "Ji Nidhi yahin hai. Bataiye kya karna hai?";
          addMessage(reply, "nidhi");
          speak(reply);
        }
      } else if (wakeMode) {
        askNidhi(heard);
      }
    };

    recognition.onerror = event => {
      statusEl.textContent = "Mic error: " + event.error;
    };

    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");

      if (wakeMode) {
        setTimeout(() => {
          try {
            recognition.start();
          } catch (e) {}
        }, 500);
      } else {
        statusEl.textContent = "“Hey Nidhi” boliye, mic dabayein ya type karein";
      }
    };
  }

  addMessage("Namaste! Main Nidhi hoon. “Hey Nidhi” boliye ya seedha type karein.", "nidhi");
  checkBridges();
</script>
</body>
</html>
